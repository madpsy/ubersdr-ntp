services:
  ubersdr-ntp:
    image: madpsy/ubersdr-ntp:latest
    container_name: ntp
    restart: unless-stopped
    # No cpu_shares: the default, the same footing as everything else. Less
    # would make the decoders the first to fall behind under load, when they
    # most need to keep up; radiod, which the capture timing rests on, is
    # real-time itself and was never protected by it. Within this container
    # the status page and MQTT already yield to the decoders (nice 10).
    # As near real time as the answer needs, and no further:
    #   rtprio   lets the NTP reply threads run SCHED_FIFO at
    #            ntp.realtime_priority (default 10). They sleep until a request
    #            and use microseconds on it, so nothing else is starved -- and
    #            the decoders stay at normal priority, below radiod.
    #   memlock  unlimited, so the daemon locks its memory and no page fault can
    #            land between a reply's transmit timestamp and its send.
    # Without these it still runs, at normal priority, and says so in the log.
    ulimits:
      rtprio: 10
      memlock: -1
    # Every setting is in ./config/config.json — the receivers, frequencies,
    # upstream NTP servers and ports. Edit it there, then ./restart.sh.
    #
    # These are optional overrides. To use one, uncomment the environment:
    # line as well as the setting: left on its own, with nothing under it,
    # that line is an empty value and Compose refuses the whole file.
    #
    # environment:
    #   # Status page / JSON API port (default: 6099, which the receiver's
    #   # addon proxy entry expects — change both together or neither).
    #   WEB_PORT: "6099"
    #
    #   # trace, debug, info, warn or error (default: info).
    #   LOG_LEVEL: "info"
    #
    #   # UberSDR's addon MQTT ingest port, only if the operator moved it
    #   # from 6926. MQTT needs no other setting.
    #   UBERSDR_INGEST_URL: "http://ubersdr:6926"
    #
    # No ports: section, deliberately. The status page is reached through the
    # receiver at /addon/ntp/, over the sdr-network. NTP itself (123/udp) is
    # not published to the host or the internet yet: it listens only inside
    # this container's network.
    sysctls:
      # Lets the unprivileged user inside bind NTP's port 123. Docker sets this
      # by default for a container's own network namespace; stated here so it
      # does not depend on that.
      net.ipv4.ip_unprivileged_port_start: 0
    networks:
      - sdr-network
    volumes:
      - ./config:/config:ro
      # The daemon's own state -- the crystal's drift, so a restart or an
      # update does not spend ten minutes measuring it again.
      - state:/var/lib/ubersdr-ntp
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"
        tag: "ntp"

volumes:
  state:

networks:
  sdr-network:
    external: true
    name: ubersdr_sdr-network
